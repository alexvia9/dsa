# Fetches free SPY.US daily prices from Stooq (S&P 500 ETF proxy) and commits
# close-to-close returns for the teaching simulator. No API key.
name: Update SPY daily returns

on:
  schedule:
    # Weekday mornings UTC — picks up prior US close after Stooq update
    - cron: '35 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and write sp500-daily-returns.json
        run: node scripts/fetch-sp500-daily.mjs

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): refresh SPY daily returns (S&P 500 proxy)'
          file_pattern: |
            public/market/sp500-daily-returns.json
            src/data/sp500-daily-returns.json
