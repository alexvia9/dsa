# Fetches SPY daily prices from Stooq (requires STOOQ_API_KEY repo secret).
name: Update SPY daily returns

on:
  schedule:
    # Weekday mornings UTC — picks up prior US close
    - cron: '35 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify Stooq secrets
        env:
          STOOQ_SPY_CSV_URL: ${{ secrets.STOOQ_SPY_CSV_URL }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: |
          if [ -z "$STOOQ_SPY_CSV_URL" ] && [ -z "$STOOQ_API_KEY" ]; then
            echo "::error::Add STOOQ_SPY_CSV_URL or STOOQ_API_KEY in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Fetch and write sp500-daily-returns.json
        env:
          STOOQ_SPY_CSV_URL: ${{ secrets.STOOQ_SPY_CSV_URL }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: node scripts/fetch-sp500-daily.mjs

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore(data): refresh SPY daily returns (S&P 500 proxy)'
          file_pattern: |
            public/market/sp500-daily-returns.json
            src/data/sp500-daily-returns.json
