# Fetches SPY daily prices from Yahoo Finance (no API key) and commits
# close-to-close returns for the teaching simulator.
name: Update SPY daily returns

on:
  schedule:
    # Weekday mornings UTC — picks up prior US close
    - cron: '35 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch and write sp500-daily-returns.json
        run: node scripts/fetch-sp500-daily.mjs

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore(data): refresh SPY daily returns (S&P 500 proxy)'
          file_pattern: |
            public/market/sp500-daily-returns.json
            src/data/sp500-daily-returns.json
